name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # 测试语义绑定 Windows 路径（file URI ↔ 盘符路径转换等），与部署目标一致
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
